name: Netrunning Lab 0.5 checks

on:
  push:
    branches: [experiment/netrunning-next]
    paths:
      - "experimental/cpr-netrunning-next/**"
      - ".github/workflows/lab-v03-check.yml"
  pull_request:
    paths:
      - "experimental/cpr-netrunning-next/**"
      - ".github/workflows/lab-v03-check.yml"

jobs:
  lab-v05:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Full integrity and regression checks
        run: node experimental/cpr-netrunning-next/tools/check.mjs
      - name: Rules tests
        run: node experimental/cpr-netrunning-next/tools/test-rules.mjs
      - name: UX baseline
        run: node experimental/cpr-netrunning-next/tools/test-v03.mjs
      - name: Motion baseline
        run: node experimental/cpr-netrunning-next/tools/test-v04.mjs
      - name: Black ICE and Slide checks
        run: node experimental/cpr-netrunning-next/tools/test-v05.mjs
